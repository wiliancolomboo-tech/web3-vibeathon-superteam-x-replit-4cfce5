[package]
name = "vibe_escrow"
version = "0.1.0"
description = "High-performance AI-Agent Micro-Task Escrow for Solana Vibeathon"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vibe_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
solana-program = "=1.17.17"